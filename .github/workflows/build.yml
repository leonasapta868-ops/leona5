name: Build leona5 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-leona5:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "leona5.cpp" -o "leona5.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-leona5
          path: "leona5.exe"
